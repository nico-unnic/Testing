<title>Golpes · Diez capas</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Sans+Condensed:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: juego horizontal a pantalla completa. Canvas debajo; HUD en las esquinas (objetivo arriba-izq, sospecha arriba-centro,
   menú arriba-der, joystick abajo-izq, acciones abajo-der). Diálogos en banda inferior con retrato. Tema oscuro único (noir). */
:root{
  color-scheme: dark;
  --night:#0a0f1c; --panel:#111a2b; --panel-2:#18233a; --line:#2a3653; --ink:#ece6d6; --muted:#8f98ad;
  --amber:#f2b33d; --amber-deep:#3b2c10; --alarm:#ef4b4b; --ok:#5cc98a; --radio:#9fd3ff;
  --paper:#ede4cc; --paper-ink:#2b2519;
  --font-display:'Special Elite','Courier New',monospace;
  --font-body:'IBM Plex Sans Condensed','Arial Narrow',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px); --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--night);color:var(--ink);font-family:var(--font-body);font-size:15px;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}

/* HUD */
.hud{position:fixed;pointer-events:none}
#leftCol{left:calc(var(--sl) + 12px);top:calc(var(--st) + 10px);width:min(30vw,300px);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
#objBox{width:100%;max-width:300px;background:color-mix(in srgb,var(--panel) 86%,transparent);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.lbl{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
#objText{margin:2px 0 0;font-size:13px;line-height:1.28;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#topMid{left:calc(var(--sl) + 12px + min(30vw,300px) + 14px);right:calc(var(--sr) + 200px);top:calc(var(--st) + 12px);display:flex;flex-direction:column;align-items:center;gap:5px}
.susp{width:100%;display:flex;align-items:center;gap:8px}
.bar{flex:1;height:5px;border-radius:3px;background:#1f2840;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--amber)}
.bar i.hot{background:var(--alarm)}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{white-space:nowrap;font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 86%,transparent);border-radius:3px;padding:2px 7px;font-variant-numeric:tabular-nums}
.chip.warn{color:var(--alarm);border-color:#6b2a2a}
.chip.time{color:var(--amber);border-color:#6b5520}
#topRight{right:calc(var(--sr) + 12px);top:calc(var(--st) + 10px);display:flex;gap:8px;pointer-events:auto}
.icon-btn{height:44px;min-width:44px;padding:0 10px;border-radius:6px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 90%,transparent);font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.icon-btn b{font-family:var(--font-mono);color:var(--amber);font-weight:500}
#radio{position:relative;width:100%;display:flex;gap:9px;align-items:flex-start;background:color-mix(in srgb,#0d1a2a 92%,transparent);border:1px solid #2b4a66;border-radius:6px;padding:7px 10px 7px 7px}
#radio .face{width:28px;height:28px;flex:none;border-radius:4px;overflow:hidden;background:#20324a}
#radio .who{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;color:var(--radio);text-transform:uppercase}
#radio p{margin:1px 0 0;font-size:13px;line-height:1.28}
#toast{left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 112px);max-width:min(52vw,480px);background:color-mix(in srgb,var(--panel) 94%,transparent);border-left:3px solid var(--amber);padding:7px 12px;font-size:13.5px;line-height:1.35;border-radius:0 6px 6px 0}
#pad{right:calc(var(--sr) + 14px);bottom:calc(var(--sb) + 14px);display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:10px;align-items:end;justify-items:end;pointer-events:auto}
.small{width:60px;height:60px;border-radius:50%;border:1.5px solid var(--line);background:color-mix(in srgb,var(--panel) 88%,transparent);font-weight:600;font-size:12px;line-height:1.1;cursor:pointer;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.small.on{border-color:var(--amber);color:var(--amber);background:var(--amber-deep)}
#photoBtn{grid-column:2;grid-row:1}
#coinBtn{grid-column:2;grid-row:1}
#crouchBtn{grid-column:1;grid-row:2}
#actBtn{grid-column:2;grid-row:2;width:92px;height:92px;border-radius:50%;border:0;padding:5px;cursor:pointer;touch-action:none;background:conic-gradient(var(--amber) calc(var(--p,0) * 360deg),var(--amber-deep) 0)}
#actBtn span{display:flex;align-items:center;justify-content:center;text-align:center;width:100%;height:100%;border-radius:50%;background:var(--panel);color:var(--amber);font-weight:600;font-size:12.5px;line-height:1.15;padding:7px}
#actBtn.idle{background:#1b2236}
#actBtn.idle span{color:var(--muted);font-weight:400}

/* Diálogo */
#dlg{position:fixed;left:calc(var(--sl) + 12px);right:calc(var(--sr) + 12px);bottom:calc(var(--sb) + 10px);display:flex;gap:12px;align-items:flex-end;pointer-events:auto;cursor:pointer}
#dlg .portrait{width:clamp(88px,22vh,150px);aspect-ratio:1;flex:none;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:#1a2540;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.portrait img,.portrait canvas,.face img,.face canvas{width:100%;height:100%;object-fit:cover;display:block}
#dlg .box{flex:1;min-width:0;background:color-mix(in srgb,var(--panel) 95%,transparent);border:1px solid var(--line);border-radius:6px;padding:10px 14px 12px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#dlg .name{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
#dlg .text{margin:4px 0 0;font-size:clamp(15px,2.3vw,18px);line-height:1.42;min-height:2.6em}
#dlg .text em{color:var(--muted)}
#dlg .more{float:right;font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:4px}
#choices{display:grid;gap:7px;margin-top:9px}
.choice{min-height:44px;text-align:left;background:var(--panel-2);border:1.5px solid var(--line);border-radius:5px;padding:9px 11px;cursor:pointer;font-size:14.5px;line-height:1.3}
.choice:hover,.choice:focus-visible{border-color:var(--amber)}
.choice b{font-family:var(--font-mono);color:var(--amber);font-weight:500;margin-right:6px}

/* Pantallas completas */
.full{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:calc(var(--st) + 16px) max(16px,calc(var(--sr) + 16px)) calc(var(--sb) + 16px) max(16px,calc(var(--sl) + 16px))}
#card{background:#000;flex-direction:column;gap:10px;text-align:center;cursor:pointer}
#card .l1{font-family:var(--font-mono);font-size:clamp(12px,2vw,15px);letter-spacing:.2em;color:var(--muted);text-transform:uppercase;min-height:1.4em}
#card .l2{font-family:var(--font-display);font-size:clamp(28px,6vw,54px);line-height:1.1;text-wrap:balance;min-height:1.1em}
#card .l3{font-size:15px;color:#bdb6a6;max-width:52ch;line-height:1.5;min-height:1.5em}
#illus{background:#000;cursor:pointer;padding:0}
#illus .img{position:absolute;inset:0;background:#000 center/cover no-repeat}
#illus canvas{position:absolute;inset:0;width:100%;height:100%}
#illus .cap{position:absolute;left:0;right:0;bottom:0;padding:40px max(20px,calc(var(--sr) + 20px)) calc(var(--sb) + 18px) max(20px,calc(var(--sl) + 20px));background:linear-gradient(transparent,rgba(0,0,0,.88) 45%)}
#illus .k{font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;color:var(--amber);text-transform:uppercase}
#illus p{margin:6px 0 0;font-size:clamp(15px,2.4vw,19px);line-height:1.5;max-width:70ch;text-wrap:pretty}
#illus .tap{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:8px}

#title{background:#05080f;padding:0;overflow:hidden}
#title .bg{position:absolute;inset:0;background:radial-gradient(90% 120% at 75% 40%,#1c2b4a 0%,#05080f 65%) center/cover no-repeat}
#title canvas.bgc{position:absolute;inset:0;width:100%;height:100%}
#title .menu{position:relative;margin-right:auto;margin-left:max(28px,calc(var(--sl) + 28px));display:flex;flex-direction:column;gap:8px;max-width:340px}
#title .k{font-family:var(--font-mono);font-size:11px;letter-spacing:.2em;color:var(--amber);text-transform:uppercase}
#title h1{font-family:var(--font-display);font-weight:400;font-size:clamp(48px,11vw,96px);line-height:.95;margin:0;letter-spacing:.02em}
#title .sub{font-size:16px;color:#c9c2b2;margin:2px 0 14px}
.mbtn{font-family:var(--font-display);font-size:18px;text-align:left;background:transparent;border:0;border-left:2px solid var(--line);padding:8px 14px;cursor:pointer;color:var(--ink)}
.mbtn:hover,.mbtn:focus-visible{border-left-color:var(--amber);color:var(--amber);outline:none}
.mbtn:disabled{opacity:.35;cursor:default}
#title .fine{font-family:var(--font-mono);font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:14px}

.sheet{position:fixed;inset:0;background:rgba(4,7,14,.86);overflow:auto;display:flex;justify-content:center;align-items:flex-start;
  padding:calc(var(--st) + 18px) max(16px,calc(var(--sr) + 16px)) calc(var(--sb) + 18px) max(16px,calc(var(--sl) + 16px));touch-action:pan-y}
.paper{width:100%;max-width:760px;background:var(--paper);color:var(--paper-ink);border-radius:3px;padding:22px 22px 18px;box-shadow:0 18px 50px rgba(0,0,0,.55);margin:auto 0}
.paper h2{font-family:var(--font-display);font-weight:400;font-size:28px;margin:0 0 4px}
.paper .meta{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;color:#6d6146;text-transform:uppercase;margin:0 0 12px}
.paper p{line-height:1.5;margin:0 0 10px;max-width:68ch}
.stamp{display:inline-block;font-family:var(--font-display);font-size:13px;letter-spacing:.14em;border:2px solid currentColor;padding:3px 8px;transform:rotate(-2deg);margin:0 0 10px}
.stamp.red{color:#b3261e}.stamp.green{color:#2f6b45}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin:8px 0 12px}
.photo{background:#fff;padding:7px 7px 9px;box-shadow:0 2px 6px rgba(0,0,0,.2);transform:rotate(var(--r,0deg))}
.photo .img{aspect-ratio:16/10;background:#333 center/cover}
.photo.empty .img{background:repeating-linear-gradient(45deg,#ddd 0 8px,#e8e8e8 8px 16px)}
.photo b{display:block;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
.photo span{font-family:var(--font-display);font-size:13.5px;line-height:1.3;display:block;margin-top:3px;color:#3a3326}
.pbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.pbtn{font-family:var(--font-display);font-size:17px;background:var(--paper-ink);color:var(--paper);border:0;border-radius:3px;padding:11px 16px;cursor:pointer}
.pbtn.alt{background:transparent;color:var(--paper-ink);border:1.5px solid var(--paper-ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:10px 0}
.stats div{border:1px solid #cdbf9c;padding:8px;border-radius:3px}
.stats span{display:block;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#6d6146}
.stats b{font-family:var(--font-mono);font-size:16px}
#rotate{background:#05080f;flex-direction:column;gap:12px;text-align:center;z-index:50}
#rotate .ph{width:44px;height:74px;border:3px solid var(--ink);border-radius:8px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
#backdrop{position:fixed;inset:0;z-index:11;background:#000}
#backdrop .img{position:absolute;inset:0;background:#000 center/cover no-repeat}
#backdrop canvas{position:absolute;inset:0;width:100%;height:100%}
#pad{opacity:.88}
#fade{position:fixed;inset:0;background:#000;pointer-events:none;opacity:0;transition:opacity .45s;z-index:10}
#flash{position:fixed;inset:0;background:#fff;pointer-events:none;opacity:0;z-index:25}
.full{z-index:20}
.sheet{z-index:30}
#dlg{z-index:12}
#rotate{z-index:50!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<canvas id="cv" aria-label="Escena del juego"></canvas>

<div class="hud" id="leftCol"><div id="objBox" hidden><div class="lbl">Objetivo</div><p id="objText"></p></div>
<div id="radio" hidden><div class="face" id="radioFace"></div><div><div class="who" id="radioWho"></div><p id="radioText"></p></div></div></div>
<div class="hud" id="topMid" hidden>
  <div class="susp" id="suspRow"><span class="lbl">Sospecha</span><div class="bar"><i id="suspBar"></i></div></div>
  <div class="chips"><span class="chip warn" id="warnChip" hidden></span><span class="chip time" id="timeChip" hidden></span></div>
</div>
<div class="hud" id="topRight" hidden>
  <button class="icon-btn" id="dossierBtn" aria-label="Abrir expediente">Expediente <b id="photoCount">0</b></button>
  <button class="icon-btn" id="pauseBtn" aria-label="Pausa">II</button>
</div>
<div class="hud" id="toast" hidden></div>
<div class="hud" id="pad" hidden>
  <button class="small" id="photoBtn" aria-label="Hacer foto">Foto</button>
  <button class="small" id="coinBtn" aria-label="Lanzar moneda" hidden>Moneda<b id="coinN" style="font-family:var(--font-mono);color:var(--amber)">3</b></button>
  <button class="small" id="crouchBtn" aria-label="Agacharse">Agachar</button>
  <button id="actBtn" class="idle"><span id="actLabel">Usar</span></button>
</div>

<div id="dlg" hidden>
  <div class="portrait" id="dlgPortrait"></div>
  <div class="box"><div class="name" id="dlgName"></div><p class="text" id="dlgText"></p><div id="choices"></div><div class="more" id="dlgMore">▸ toca</div></div>
</div>

<div id="backdrop" hidden><div class="img" id="backdropImg"></div><canvas id="backdropCv"></canvas></div>
<div class="full" id="card" hidden><div class="l1" id="cardL1"></div><div class="l2" id="cardL2"></div><div class="l3" id="cardL3"></div></div>
<div class="full" id="illus" hidden><div class="img" id="illusImg"></div><canvas id="illusCv"></canvas><div class="cap"><div class="k" id="illusK"></div><p id="illusText"></p><div class="tap">▸ toca para continuar</div></div></div>

<div class="full" id="title" hidden>
  <div class="bg" id="titleBg"></div><canvas class="bgc" id="titleCv"></canvas>
  <div class="menu">
    <div class="k">Episodio 1</div>
    <h1>GOLPES</h1>
    <div class="sub">Diez capas · Amberes, 2003</div>
    <button class="mbtn" id="newBtn">Nueva partida</button>
    <button class="mbtn" id="contBtn">Continuar</button>
    <button class="mbtn" id="chapBtn">Capítulos</button>
    <div class="fine">Inspirado en hechos reales · Personajes de ficción</div>
  </div>
</div>

<div class="sheet" id="sheet" hidden><div class="paper" id="sheetBody"></div></div>
<div class="full" id="rotate" hidden><div class="ph"></div><div>Gira el móvil para jugar en horizontal</div></div>
<div id="flash"></div>
<div id="fade"></div>

<script src="js/core.js"></script>
<script src="js/render.js"></script>
<script src="js/maps.js"></script>
<script src="js/game.js"></script>
<script src="js/story.js"></script>
